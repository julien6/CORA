      num_agents: 3
      lidar_num_beams: 32
      map_params:
        map_size: [7, 7]
        fill: 0.2
evaluation:
  horizon: 25
  gamma: 0.99
  swap_cost: 0.1
  diagnostic_scale: 1.0
  oracle_repeats: 64
training:
  total_environment_steps: 40400
  environments: 4
  updates: 100
  epochs: 1
  minibatches: 1
  hidden_size: 64
estimation:
  ridge: 0.01
  diagnostic_scale: 1.0
  experiment_cost_weight: 0.0
  regret_threshold: 0.1
media:
  enabled: true
  seed: 0
  fps: 10
statistics:
  bootstrap_samples: 1000
  confidence: 0.95
