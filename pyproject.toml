[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cora-poc"
version = "0.1.0"
description = "Engineering smoke test for causal organizational reconfiguration"
requires-python = ">=3.11,<3.13"
dependencies = [
  "jax[cpu]==0.4.38", "jaxmarl==0.2.0", "flax==0.10.2",
  "optax==0.2.4", "distrax==0.1.5", "chex==0.1.89",
  "numpy==2.2.6", "matplotlib==3.10.3", "hydra-core==1.3.2",
  "gymnax==0.0.9", "wandb==0.19.11", "orbax-checkpoint==0.11.5",
  "flashbax==0.1.3", "pillow==12.3.0", "imageio==2.37.0",
]

[project.optional-dependencies]
diagrams = ["moise-diagram @ git+https://github.com/julien6/MOISE_Diagram.git@0403d820dea1773559e79bb7771d00e8a8016678"]
test = ["pytest==8.3.5"]

[project.scripts]
cora-poc = "cora.poc:main"
cora-bench = "cora.benchmarks.release:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

